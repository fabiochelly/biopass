<!doctype html><meta charset=utf-8><title>Saisie réelle</title>
<style>body{font:16px sans-serif;padding:40px} input{display:block;margin:10px 0;padding:8px;width:260px}</style>
<h1>Connexion</h1>
<!-- site qui ne retient que la frappe réelle (événements isTrusted) et réaffiche son modèle en quittant le champ -->
<form action="after.php" method="post">
  <input id="email" name="email" type="email" placeholder="E-mail">
  <input id="password" name="password" type="password" placeholder="Mot de passe">
  <button>Se connecter</button>
</form>
<script>
  for (const el of document.querySelectorAll('input')) {
    let model = '';
    el.addEventListener('input', (e) => { if (e.isTrusted) model = el.value; });
    el.addEventListener('blur', () => { el.value = model; });
  }
</script>
