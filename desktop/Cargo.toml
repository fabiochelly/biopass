[package]
name = "biopass"
version = "0.1.0"
edition = "2021"
description = "BioPass — application de bureau (gestionnaire de mots de passe familial)"
license = "MIT"

[lib]
name = "biopass"
path = "src/lib.rs"

[[bin]]
name = "biopass"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "clipboard", "links"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
url = "2.5"
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
hkdf = "0.12"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
dirs = "6"
png = "0.18"
unicode-normalization = "0.1"
zeroize = { version = "1", features = ["std"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

# PBKDF2 600 000 itérations : indispensable d'optimiser la crypto même en debug.
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1
